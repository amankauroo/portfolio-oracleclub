<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photography</title>
    <meta
      name="description"
      content="A photography gallery by Aman Kauroo featuring photography, videography and astrophotography."
    />
    <meta name="author" content="Aman Kauroo" />
    <meta property="og:title" content="Photography | Aman Kauroo" />
    <meta
      property="og:description"
      content="A gallery featuring photography, videography and astrophotography."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/assets/profile.png" />
    <link rel="icon" type="image/x-icon" href="/assets/logo.png" />
  </head>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fef7e7;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .navbar {
      background-color: #f9e1ae;
      padding: 0px;
      margin: 0px;
      overflow: hidden;
      display: flex;
      border-radius: 0px 0px 15px 15px;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.3);
      justify-content: space-between;
      align-items: center;
    }
    .navbar img {
      float: left;
      width: 50px;
      height: 50px;
      margin-top: 10px;
      margin-left: 20px;
      margin-bottom: 10px;
      border-radius: 15px;
      display: block;
    }
    .quick_links {
      display: flex;
      gap: 30px;
      margin-right: 1rem;
    }
    .quick_links a {
      background-color: #29a7f5;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.3);
      border-radius: 15px;
      color: white;
      text-decoration: none;
      padding: 14px 16px;
      display: block;
    }
    .quick_links a:hover {
      background-color: #1e90ff;
    }
    .nav-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 1.8rem;
      line-height: 1;
      cursor: pointer;
      margin-right: 20px;
      color: #333;
    }
    @media (max-width: 700px) {
      .navbar {
        flex-wrap: wrap;
        padding: 5px 0;
      }
      .navbar img {
        width: 40px;
        height: 40px;
        margin: 8px 0 8px 15px;
      }
      .nav-toggle {
        display: block;
      }
      .quick_links {
        display: none;
        flex-direction: column;
        width: 100%;
        gap: 0;
        margin: 0;
        padding: 0 15px 15px;
        box-sizing: border-box;
      }
      .quick_links.open {
        display: flex;
      }
      .quick_links a {
        margin: 6px 0;
        text-align: center;
        padding: 12px 16px;
      }
    }
    .herosection {
      text-align: center;
      padding: 60px 20px 30px;
    }
    .herosection p {
      max-width: 700px;
      margin: 10px auto 0;
      color: #444;
      line-height: 1.6;
    }
    .gallery {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 20px 60px;
      width: 100%;
      box-sizing: border-box;
    }
    @media (max-width: 900px) {
      .gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (max-width: 600px) {
      .gallery {
        grid-template-columns: 1fr;
      }
    }
    .gallery img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 15px;
      box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.3);
      display: block;
    }
    footer {
      background-color: #fef7e7;
      padding: 10px;
      text-align: center;
    }
  </style>
  <body>
    <div class="navbar">
      <a href="index.html">

  <script>
    const navToggle = document.querySelector(".nav-toggle");
    const quickLinks = document.querySelector(".quick_links");
    navToggle.addEventListener("click", () => {
      const isOpen = quickLinks.classList.toggle("open");
      navToggle.setAttribute("aria-expanded", isOpen);
    });
  </script>
